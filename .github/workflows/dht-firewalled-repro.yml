name: hyperdht firewalled:false repro
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: repro
      - run: node index.js
        working-directory: repro
      - run: node raw-udx.js
        if: always()
        working-directory: repro
      - run: node raw-dht-rpc.js
        if: always()
        working-directory: repro
      - run: node raw-hyperdht-ping.js
        if: always()
        working-directory: repro
