name: Test Status
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: powershell
        continue-on-error: true
        # Defender inspecting every loopback UDP packet massively slows down
        # the DHT tests on Windows runners, causing DHT lookups to time out
        # (PEER_NOT_FOUND) before any peer can respond.
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - run: npm install
      - run: npm run test
